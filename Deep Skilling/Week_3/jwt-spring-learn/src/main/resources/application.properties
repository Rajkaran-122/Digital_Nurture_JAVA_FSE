server.port=8090

spring.application.name=jwt-spring-learn
logging.level.org.springframework=info
logging.level.org.springframework.security=debug
logging.level.com.cognizant.springlearn=debug
logging.pattern.console=%d{yyMMdd}|%d{HH:mm:ss.SSS}|%-20.20thread|%5p|%-35.35logger{35}|%25M|%m%n
server.error.include-message=always
server.error.include-stacktrace=never
jwt.secret=dfhdfljkhedfjdfhdjlfhdjfhrdf890574895745hfgjkdfngfjklg
jwt.expiration-ms=1200000

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.sql.init.mode=always
